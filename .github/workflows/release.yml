# Builds the desktop app for every platform and the library data it downloads,
# and attaches them to the GitHub release for the tag. Push a tag that matches
# package.json's version (v0.2.0 for "0.2.0") to run it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to (for example v0.2.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  app:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            targets: bun-linux-x64,bun-linux-arm64
          # Windows builds run on Windows: only there can the .exe get its icon
          # and run without a console window, and the setup program be built.
          - runner: windows-latest
            targets: bun-windows-x64
          # macOS builds run on a Mac so the .app can be signed (ad hoc), which
          # Apple Silicon requires before it will run a program at all, and
          # packed into a .dmg.
          - runner: macos-latest
            targets: bun-darwin-arm64,bun-darwin-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          # The app build needs the code, not the 1.4 GB corpus.
          sparse-checkout: |
            assets
            client
            installer
            server
            ingest
            scripts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Check the tag matches package.json
        shell: bash
        run: test "v$(bun -e 'console.log(require("./package.json").version)')" = "$TAG"
      - run: bun install --frozen-lockfile
      - name: Build the app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            bun run build:app --target=${{ matrix.targets }}
          else
            bun run build:app --target=${{ matrix.targets }} --package
          fi
      - name: Build the Windows setup program
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = "${env:TAG}".TrimStart("v")
          & $iscc "/DAppVersion=$version" installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v5
        with:
          name: app-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/*.dmg
            dist/*-setup.exe
          if-no-files-found: error

  # The ready-made library database the app downloads: about 7 GB built,
  # compressed with zstd and split into parts under the 2 GB release limit.
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        # The build needs about 7 GB for the database plus room to compress it;
        # the runner's preinstalled toolchains take most of the disk.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build:library
      - uses: actions/upload-artifact@v5
        with:
          name: library
          path: |
            dist/uwl-library-*.json
            dist/uwl-library-*.db.zst.*
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [app, library]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: .github
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create the release if needed, then attach the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md > notes.md
            gh release create "$TAG" --title "Universal Wisdom Library $VERSION" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
